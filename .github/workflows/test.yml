name: PHP Unit

on: 
  push:
    branches:
    - '*'
  pull_request:

jobs:
  phpunit:
    name: PHPUnit (EC-CUBE ${{ matrix.eccube }}, PHP ${{ matrix.php }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eccube: [ '4.3' ]
        php: [ '8.2', '8.3' ]
        db: [ mysql, pgsql ]
        plugin-code: [ UnivaPay ]
        include:
          - db: mysql
            database_url: mysql://root:root@127.0.0.1:3306/eccube_db
            database_server_version: 8.0
          - db: pgsql
            database_url: postgres://postgres:password@127.0.0.1:5432/eccube_db
            database_server_version: 14

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=5

      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - name: Checkout EC-CUBE
      uses: actions/checkout@v6
      with:
        repository: EC-CUBE/ec-cube
        ref: ${{ matrix.eccube }}

    - name: Checkout UnivaPay Plugin
      uses: actions/checkout@v6
      with:
        path: app/Plugin/${{ matrix.plugin-code }}

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: apcu, intl, pdo_mysql, pdo_pgsql, zip, gd
        tools: composer:v2

    - name: Get Composer Cache Directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - uses: actions/cache@v5
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ matrix.eccube }}-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-${{ matrix.eccube }}-${{ matrix.php }}-

    - name: composer install
      run: composer install --no-scripts --no-progress

    - name: Setup EC-CUBE and plugin
      env:
        APP_ENV: 'test'
        DATABASE_URL: ${{ matrix.database_url }}
        DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
        ECCUBE_LOCALE: ja
      run: |
        bin/console doctrine:database:create
        bin/console doctrine:schema:create
        bin/console eccube:fixtures:load
        bin/console eccube:plugin:install --code ${{ matrix.plugin-code }}
        bin/console eccube:plugin:enable --code ${{ matrix.plugin-code }}
        bin/console cache:clear --no-warmup

    - name: PHPUnit for plugin
      env:
        APP_ENV: 'test'
        DATABASE_URL: ${{ matrix.database_url }}
        DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
        MAILER_DSN: 'null://null'
      run: |
        vendor/bin/phpunit app/Plugin/${{ matrix.plugin-code }}/Tests
