services:
    Plugin\UnivaPay\Entity\Master\UnivaPayOrderStatus:
        class: Plugin\UnivaPay\Entity\Master\UnivaPayOrderStatus

    eccube.purchase.flow.univapay.subscription_order:
        class: Eccube\Service\PurchaseFlow\PurchaseFlow
        calls:
            - [ setFlowType, [ 'shopping' ] ]
            - [ addPurchaseProcessor, [ '@eccube.purchase.flow.purchase.processor.pre.order.id.validator' ] ]
            - [ addPurchaseProcessor, [ '@eccube.purchase.flow.purchase.processor.point.processor' ] ]
            - [ addPurchaseProcessor, [ '@Plugin\UnivaPay\Service\PurchaseFlow\Processor\SubscriptionOrderStockReduceProcessor' ] ]
            - [ addPurchaseProcessor, [ '@eccube.purchase.flow.purchase.processor.customer.purchase.info.processor' ] ]
            - [ addPurchaseProcessor, [ '@eccube.purchase.flow.purchase.processor.order.update.processor' ] ]

    Plugin\UnivaPay\Service\SubscriptionOrderCreator:
        autowire: true
        arguments:
            $shoppingPurchaseFlow: '@eccube.purchase.flow.univapay.subscription_order'

monolog:
    channels: ['univapay']
    handlers:
        univapay:
            type: rotating_file
            channels: ['univapay']
            level: info
            max_files: 60
            path: '%kernel.logs_dir%/%kernel.environment%/univapay.log'
            formatter: eccube.log.formatter.line

imports:
    - resource: 'order_state_machine.php'
